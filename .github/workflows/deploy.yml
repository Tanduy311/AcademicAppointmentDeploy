name: Auto Deploy Backend & Database to MonsterASP

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'
      - 'README.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AcademicAppoinment.csproj

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply Database Migrations
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "DB_CONNECTION_STRING secret is empty or missing."
            exit 1
          fi

          dotnet ef database update \
            --project AcademicAppoinment.csproj \
            --startup-project AcademicAppoinment.csproj \
            --connection "$DB_CONNECTION_STRING"

      - name: Publish .NET app
        run: dotnet publish AcademicAppoinment.csproj -c Release -o ./publish

      - name: Configure published appsettings
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "DB_CONNECTION_STRING secret is empty or missing."
            exit 1
          fi

          tmp_file="$(mktemp)"
          jq --arg db "$DB_CONNECTION_STRING" \
            '.ConnectionStrings.DBConnection = $db' \
            ./publish/appsettings.json > "$tmp_file"
          mv "$tmp_file" ./publish/appsettings.json

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false
